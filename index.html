<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
    <title>Gyros House</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg:#f5f0e8; --card:#fff; --accent:#c0392b; --gold:#c8860a;
            --dark:#1a1208; --text:#2c1f0e; --muted:#9a8870; --border:#e8dfc8;
            --radius:16px; --shadow:0 4px 20px rgba(0,0,0,.08);
        }
        *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
        body{background:var(--bg);color:var(--text);font-family:'DM Sans',sans-serif;min-height:100vh;}

        header{background:var(--dark);padding:12px 16px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100;gap:10px;}
        .logo{font-family:'Playfair Display',serif;font-size:20px;font-weight:900;color:#fff;line-height:1;flex-shrink:0;}
        .logo span{color:#e8c84a;}
        .logo small{display:block;font-family:'DM Sans',sans-serif;font-size:9px;font-weight:400;letter-spacing:3px;color:#a89070;text-transform:uppercase;margin-top:2px;}
        .header-right{display:flex;align-items:center;gap:8px;}

        .lang-wrapper{position:relative;}
        .lang-btn{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);border-radius:8px;padding:7px 10px;color:#fff;font-size:13px;cursor:pointer;display:flex;align-items:center;gap:5px;}
        .lang-dropdown{position:absolute;top:calc(100% + 6px);right:0;background:#fff;border:1px solid var(--border);border-radius:12px;box-shadow:0 8px 32px rgba(0,0,0,.18);overflow:hidden;min-width:160px;z-index:200;opacity:0;transform:translateY(-8px) scale(.96);pointer-events:none;transition:all .2s;}
        .lang-dropdown.open{opacity:1;transform:translateY(0) scale(1);pointer-events:all;}
        .lang-option{display:flex;align-items:center;gap:10px;padding:11px 14px;cursor:pointer;font-size:13px;color:var(--text);}
        .lang-option.active{background:#fff5e0;color:var(--gold);}

        .cart-btn{background:var(--accent);border:none;border-radius:50px;padding:9px 14px;color:#fff;font-weight:600;cursor:pointer;display:flex;align-items:center;gap:6px;}
        .cart-badge{background:#e8c84a;color:#000;border-radius:50%;width:20px;height:20px;display:flex;align-items:center;justify-content:center;font-size:11px;}
        .cart-badge.hidden{display:none;}

        .delivery-banner{background:linear-gradient(90deg,#27ae60,#2ecc71);padding:9px 18px;display:flex;align-items:center;justify-content:center;gap:8px;color:#fff;font-size:13px;font-weight:600;}

        .hero{background:linear-gradient(135deg,#2c1810 0%,#8b2500 100%);padding:20px;display:flex;align-items:center;justify-content:space-between;color:#fff;}
        .hero-title{font-family:'Playfair Display',serif;font-size:30px;line-height:1.1;}
        .hero-emoji{font-size:60px;}

        .cats{display:flex;gap:8px;padding:12px 16px;overflow-x:auto;scrollbar-width:none;}
        .cat-btn{flex-shrink:0;background:var(--card);border:1.5px solid var(--border);border-radius:50px;padding:7px 14px;font-size:13px;cursor:pointer;}
        .cat-btn.active{background:var(--accent);color:#fff;border-color:var(--accent);}

        .menu{padding:0 12px 120px;display:flex;flex-direction:column;gap:10px;}
        .item-card{background:var(--card);border-radius:var(--radius);border:1px solid var(--border);display:flex;align-items:center;gap:12px;padding:13px;position:relative;}
        .item-emoji{font-size:44px;width:60px;height:60px;display:flex;align-items:center;justify-content:center;background:var(--bg);border-radius:12px;}
        .item-info{flex:1;}
        .item-name{font-family:'Playfair Display',serif;font-size:15px;font-weight:700;}
        .item-price{font-family:'Playfair Display',serif;font-size:16px;font-weight:700;color:var(--gold);}
        .add-btn{background:var(--accent);border:none;width:34px;height:34px;border-radius:50%;color:#fff;font-size:20px;cursor:pointer;}
        .qty-chip{position:absolute;top:9px;left:9px;background:var(--accent);color:#fff;border-radius:50px;padding:2px 8px;font-size:11px;opacity:0;transition:0.2s;}
        .qty-chip.show{opacity:1;}

        .overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:200;}
        .overlay.open{display:block;}
        .cart-sheet{position:fixed;bottom:0;left:0;right:0;z-index:300;background:#fff;border-radius:22px 22px 0 0;transform:translateY(100%);transition:0.3s;max-height:90vh;overflow-y:auto;}
        .cart-sheet.open{transform:translateY(0);}
        .sheet-header{background:var(--dark);padding:14px 20px;color:#fff;border-radius:22px 22px 0 0;}
        .cart-body{padding:16px;}
        .cart-item{display:flex;align-items:center;gap:12px;padding:10px;background:var(--bg);border-radius:12px;margin-bottom:10px;}
        .field-input{width:100%;background:var(--bg);border:1.5px solid var(--border);border-radius:10px;padding:11px;margin-top:5px;outline:none;}
        .field-input.error{border-color:var(--accent);}
        .total-row{display:flex;justify-content:space-between;padding:15px 0;font-weight:700;font-size:20px;}
        .order-btn{width:100%;background:var(--accent);border:none;border-radius:14px;padding:16px;color:#fff;font-size:19px;font-weight:700;cursor:pointer;}

        .success-screen{display:none;position:fixed;inset:0;z-index:500;background:var(--dark);color:#fff;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:20px;}
        .success-screen.show{display:flex;}
        body.rtl{direction:rtl;}
    </style>
</head>
<body>

<header>
    <div class="logo">Gyros<span>House</span><small id="logo-sub">Greek Kitchen</small></div>
    <div class="header-right">
        <div class="lang-wrapper">
            <div class="lang-btn" onclick="toggleLang()" id="lang-btn">🇬🇧 EN ▼</div>
            <div class="lang-dropdown" id="lang-dropdown">
                <div class="lang-option" onclick="setLang('en')" id="opt-en">🇬🇧 English</div>
                <div class="lang-option" onclick="setLang('hu')" id="opt-hu">🇭🇺 Magyar</div>
                <div class="lang-option" onclick="setLang('fa')" id="opt-fa">🇮🇷 فارسی</div>
            </div>
        </div>
        <button class="cart-btn" onclick="openCart()">
            🛒 <span id="cart-label">Cart</span>
            <div class="cart-badge hidden" id="cart-badge">0</div>
        </button>
    </div>
</header>

<div class="delivery-banner">🛵 <span id="delivery-text">FREE Delivery!</span></div>

<div class="hero">
    <div>
        <div class="hero-title" id="hero-title">Fresh &<br>Delicious</div>
    </div>
    <div class="hero-emoji">🥙</div>
</div>

<div class="cats" id="cats-bar"></div>
<div class="menu" id="menu"></div>

<div class="overlay" id="overlay" onclick="closeCart()"></div>
<div class="cart-sheet" id="cart-sheet">
    <div class="sheet-header"><div class="sheet-title" id="sheet-title">🛒 My Order</div></div>
    <div class="cart-body">
        <div id="cart-items"></div>
        <div class="divider"></div>
        <label class="field-label" id="addr-label">Delivery Address</label>
        <textarea class="field-input" id="address" rows="2" placeholder="Full address..."></textarea>
        <input class="field-input" id="note" type="text" placeholder="Note (optional)">
        <div class="total-row">
            <span id="total-label">Total</span>
            <span id="total-amount">0 Ft</span>
        </div>
        <button class="order-btn" id="order-btn" onclick="placeOrder()">Place Order</button>
    </div>
</div>

<div class="success-screen" id="success">
    <div style="font-size:80px">✅</div>
    <h1 id="success-title">Success!</h1>
    <div id="success-amount" style="font-size:24px; margin: 10px 0;"></div>
    <p id="success-sub">Coming soon! Pay cash on delivery. 🛵</p>
</div>

<script>
    const tg = window.Telegram.WebApp;
    tg.ready();
    tg.expand();

    let cart = {};
    let lang = 'en';
    let currentCat = 'all';

    const T = {
        en: {
            logoSub:'Greek Kitchen', cartLabel:'Cart', deliveryText:'🎉 FREE Delivery!',
            heroTitle:'Fresh &<br>Delicious', sheetTitle:'🛒 My Order', addrLabel:'Address',
            totalLabel:'Total', orderBtn:'Place Order', successTitle:'Order Placed!',
            successSub:"We'll deliver soon! Pay cash. 💵", rtl: false,
            items:[
                {id:1, name:'Gyros Pita', emoji:'🥙', price:1349, cat:'gyros'},
                {id:2, name:'Gyros Tortilla', emoji:'🌯', price:1549, cat:'gyros'},
                {id:3, name:'Gyros Plate (small)', emoji:'🍽️', price:2299, cat:'gyros'},
                {id:4, name:'Gyros Plate (large)', emoji:'🫕', price:2599, cat:'gyros'},
                {id:7, name:'French Fries', emoji:'🍟', price:849, cat:'sides'},
                {id:11, name:'Coca-Cola', emoji:'🥤', price:499, cat:'drinks'},
                {id:14, name:'Baklava', emoji:'🍯', price:999, cat:'desserts'}
            ]
        },
        hu: {
            logoSub:'Görög konyha', cartLabel:'Kosár', deliveryText:'🎉 INGYENES kiszállítás!',
            heroTitle:'Friss &<br>Finom', sheetTitle:'🛒 Rendelésem', addrLabel:'Cím',
            totalLabel:'Összesen', orderBtn:'Rendelés leadása', successTitle:'Sikeres rendelés!',
            successSub:'Hamarosan érkezünk! Fizetés készpénzzel. 💵', rtl: false,
            items:[
                {id:1, name:'Gyros pita', emoji:'🥙', price:1349, cat:'gyros'},
                {id:2, name:'Gyros tortilla', emoji:'🌯', price:1549, cat:'gyros'},
                {id:3, name:'Gyros tál (kicsi)', emoji:'🍽️', price:2299, cat:'gyros'},
                {id:4, name:'Gyros tál (nagy)', emoji:'🫕', price:2599, cat:'gyros'},
                {id:7, name:'Hasábburgonya', emoji:'🍟', price:849, cat:'sides'},
                {id:11, name:'Coca-Cola', emoji:'🥤', price:499, cat:'drinks'},
                {id:14, name:'Baklava', emoji:'🍯', price:999, cat:'desserts'}
            ]
        },
        fa: {
            logoSub:'آشپزخانه یونانی', cartLabel:'سبد', deliveryText:'🎉 ارسال رایگان!',
            heroTitle:'تازه و<br>خوشمزه', sheetTitle:'🛒 سفارش من', addrLabel:'آدرس',
            totalLabel:'جمع کل', orderBtn:'ثبت سفارش', successTitle:'سفارش ثبت شد!',
            successSub:'به زودی می‌رسیم! پرداخت نقدی. 💵', rtl: true,
            items:[
                {id:1, name:'جیروس پیتا', emoji:'🥙', price:1349, cat:'gyros'},
                {id:2, name:'جیروس تورتیلا', emoji:'🌯', price:1549, cat:'gyros'},
                {id:3, name:'بشقاب جیروس', emoji:'🍽️', price:2299, cat:'gyros'},
                {id:4, name:'بشقاب بزرگ', emoji:'🫕', price:2599, cat:'gyros'},
                {id:7, name:'سیب‌زمینی', emoji:'🍟', price:849, cat:'sides'},
                {id:11, name:'کوکاکولا', emoji:'🥤', price:499, cat:'drinks'},
                {id:14, name:'باقلوا', emoji:'🍯', price:999, cat:'desserts'}
            ]
        }
    };

    function fmt(p){ return p.toLocaleString('hu-HU') + ' Ft'; }

    function applyLang(l) {
        lang = l;
        const t = T[l];
        document.body.classList.toggle('rtl', t.rtl);
        document.getElementById('logo-sub').textContent = t.logoSub;
        document.getElementById('cart-label').textContent = t.cartLabel;
        document.getElementById('delivery-text').textContent = t.deliveryText;
        document.getElementById('hero-title').innerHTML = t.heroTitle;
        document.getElementById('sheet-title').textContent = t.sheetTitle;
        document.getElementById('addr-label').textContent = t.addrLabel;
        document.getElementById('total-label').textContent = t.totalLabel;
        document.getElementById('order-btn').textContent = t.orderBtn;
        document.getElementById('success-title').textContent = t.successTitle;
        document.getElementById('success-sub').textContent = t.successSub;
        document.getElementById('lang-btn').textContent = (l==='en'?'🇬🇧 EN':l==='hu'?'🇭🇺 HU':'🇮🇷 FA') + ' ▼';
        renderMenu();
    }

    function toggleLang() { document.getElementById('lang-dropdown').classList.toggle('open'); }
    function setLang(l) { document.getElementById('lang-dropdown').classList.remove('open'); applyLang(l); }

    function renderMenu() {
        const items = T[lang].items;
        document.getElementById('menu').innerHTML = items.map(item => `
            <div class="item-card">
                <div class="qty-chip ${cart[item.id] ? 'show' : ''}" id="chip-${item.id}">×${cart[item.id]?.qty || 0}</div>
                <div class="item-emoji">${item.emoji}</div>
                <div class="item-info">
                    <div class="item-name">${item.name}</div>
                    <div class="item-price">${fmt(item.price)}</div>
                </div>
                <button class="add-btn" onclick="addItem(${item.id})">+</button>
            </div>
        `).join('');
    }

    function addItem(id) {
        const itemBase = T[lang].items.find(i => i.id === id);
        if (!cart[id]) cart[id] = { ...itemBase, qty: 0 };
        cart[id].qty++;
        updateBadge();
        renderMenu();
    }

    function updateBadge() {
        const total = Object.values(cart).reduce((s, i) => s + i.qty, 0);
        const badge = document.getElementById('cart-badge');
        badge.textContent = total;
        badge.classList.toggle('hidden', total === 0);
    }

    function openCart() {
        renderCartSheet();
        document.getElementById('overlay').classList.add('open');
        document.getElementById('cart-sheet').classList.add('open');
    }

    function closeCart() {
        document.getElementById('overlay').classList.remove('open');
        document.getElementById('cart-sheet').classList.remove('open');
    }

    function renderCartSheet() {
        const items = Object.values(cart).filter(i => i.qty > 0);
        const container = document.getElementById('cart-items');
        if (items.length === 0) {
            container.innerHTML = '<p style="text-align:center; padding:20px;">Empty cart!</p>';
            document.getElementById('total-amount').textContent = '0 Ft';
            return;
        }
        container.innerHTML = items.map(i => `
            <div class="cart-item">
                <div style="flex:1"><b>${i.name}</b><br>${fmt(i.price * i.qty)}</div>
                <div style="display:flex; align-items:center; gap:10px;">
                    <button onclick="changeQty(${i.id}, -1)" style="width:25px">-</button>
                    <span>${i.qty}</span>
                    <button onclick="changeQty(${i.id}, 1)" style="width:25px">+</button>
                </div>
            </div>
        `).join('');
        const total = items.reduce((s, i) => s + i.price * i.qty, 0);
        document.getElementById('total-amount').textContent = fmt(total);
    }

    function changeQty(id, delta) {
        if (!cart[id]) return;
        cart[id].qty += delta;
        if (cart[id].qty <= 0) delete cart[id];
        updateBadge();
        renderCartSheet();
        renderMenu();
    }

    async function placeOrder() {
    const address = document.getElementById('address').value.trim();
    const items = Object.values(cart).filter(i => i.qty > 0);
    if (!address || items.length === 0) {
        alert("Please fill address and add items!");
        return;
    }
    const total = items.reduce((s, i) => s + i.price * i.qty, 0);
    const orderData = {
        items: items,
        total: total,
        address: address,
        note: document.getElementById('note').value,
        user: tg.initDataUnsafe?.user || { first_name: "Customer" },
        initData: tg.initData  // for verification
    };

    try {
        const res = await fetch('https://YOUR-RENDER-URL.onrender.com/order', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(orderData)
        });

        if (res.ok) {
            document.getElementById('cart-sheet').classList.remove('open');
            document.getElementById('overlay').classList.remove('open');
            document.getElementById('success-amount').textContent = fmt(total);
            document.getElementById('success').classList.add('show');
        } else {
            alert("Order failed. Please try again.");
        }
    } catch(e) {
        alert("Connection error. Please try again.");
    }
}

        // SEND TO BOT
        tg.sendData(JSON.stringify(orderData));

        document.getElementById('cart-sheet').classList.remove('open');
        document.getElementById('overlay').classList.remove('open');
        document.getElementById('success-amount').textContent = fmt(total);
        document.getElementById('success').classList.add('show');
    }

    applyLang('en');
</script>
</body>
</html>
